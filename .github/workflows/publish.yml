name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Publish
        run: uv publish
