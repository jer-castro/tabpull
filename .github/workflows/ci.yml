name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # no-mistakes ci-workflow emits actions/setup-go@v5 (go-version-file: go.mod).
      # This repo has no go.mod; uv 0.12.19 is pinned in mise.toml and Python 3.12 in .python-version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false

      - name: Lint
        run: |
          uv run ruff check && uv run ruff format --check && uv run ty check

      - name: Test
        run: |
          uv run pytest
