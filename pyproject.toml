[project]
name = "tabpull"
version = "0.1.0"
description = "Export Tableau dashboard sheet crosstabs with filters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Castro", email = "160854558+jer-castro@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
  "playwright==1.63.0",
  "questionary==2.1.1",
  "rich==15.0.0",
  "tableauserverclient==0.41",
  "textual==8.2.8",
]

[project.urls]
Homepage = "https://github.com/jer-castro/tabpull"
Repository = "https://github.com/jer-castro/tabpull"
Issues = "https://github.com/jer-castro/tabpull/issues"

[project.scripts]
tabpull = "tabpull.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]

package = true

python-preference = "only-managed"
exclude-newer = "7 days"
constraint-dependencies = ["litellm!=1.82.7,!=1.82.8"]
add-bounds = "exact"

[dependency-groups]

dev = ["pytest==9.1.1", "ruff==0.15.20", "ty==0.0.59"]

[tool.ruff.lint]
ignore = [
  "line-too-long",
  "module-import-not-at-top-of-file",
  "blanket-noqa",
  "empty-docstring",
  "implicit-namespace-package",
]
extend-select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "PIE",
  "LOG",
  "N",
  "ARG",
  "PT",
  "PGH",
  "PLE",
  "implicit-namespace-package",
  "asyncio-dangling-task",
  "suspicious-eval-usage",
  "subprocess-popen-with-shell-equals-true",
  "hardcoded-sql-expression",
  "unsafe-yaml-load",
  "suspicious-pickle-usage",
  "hashlib-insecure-hash-function",
  "request-without-timeout",
]
preview = true
unfixable = ["unused-import"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ARG", "implicit-namespace-package"]
"tests/**/conftest.py" = ["ARG", "implicit-namespace-package"]

[tool.ty.rules]
missing-type-argument = "error"
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
