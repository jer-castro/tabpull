<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">tabpull: crosstab any sheet, skip the workbook</title>
  <desc id="desc">Command-line crosstab export from Tableau dashboards, including hidden sheets, without downloading the workbook.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="wash" cx="78%" cy="40%" r="45%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="480" rx="12" fill="url(#canvas)"/>
  <rect width="1280" height="480" rx="12" fill="url(#wash)"/>
  <rect x="0.5" y="0.5" width="1279" height="479" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="64" y="96" width="40" height="5" rx="2.5" fill="#2f81f7"/>
    <text x="60" y="188" font-size="72" font-weight="800" letter-spacing="-0.04em" fill="#e6edf3">tabpull</text>
    <text x="64" y="240" font-size="24" font-weight="500" fill="#c9d1d9">Crosstab any sheet. Skip the workbook.</text>
    <text x="64" y="288" font-size="16" fill="#8b949e">Hidden sheets included. Embedding API, SSO, and a PAT.</text>
    <text x="64" y="400" font-size="14" fill="#6e7681">setup → add → run</text>
  </g>

  <g transform="translate(620 70)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect width="596" height="340" rx="14" fill="#010409" stroke="#30363d"/>
    <rect x="6" y="6" width="584" height="328" rx="8" fill="#0d1117"/>
    <circle cx="36" cy="36" r="5" fill="#ff5f56"/>
    <circle cx="54" cy="36" r="5" fill="#ffbd2e"/>
    <circle cx="72" cy="36" r="5" fill="#27c93f"/>
    <text x="100" y="40" font-size="12" fill="#6e7681" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">export · tabpull</text>
    <text x="36" y="88" font-size="15" fill="#8b949e"><tspan fill="#3fb950">❯</tspan> tabpull setup --site finance</text>
    <text x="36" y="116" font-size="14" fill="#6e7681"># PAT checked · SSO signed in</text>
    <text x="36" y="160" font-size="15" fill="#8b949e"><tspan fill="#3fb950">❯</tspan> tabpull add --view Sales/Overview \</text>
    <text x="36" y="188" font-size="15" fill="#8b949e">    --sheet "Order Detail" --name daily-west</text>
    <text x="36" y="224" font-size="15" fill="#c9d1d9">Saved job 'daily-west'</text>
    <text x="36" y="252" font-size="14" fill="#6e7681">Run it: tabpull run daily-west</text>
    <text x="36" y="288" font-size="15" fill="#8b949e"><tspan fill="#3fb950">❯</tspan> tabpull run daily-west</text>
    <text x="36" y="316" font-size="13" fill="#c9d1d9"><tspan fill="#3fb950">✓</tspan> daily-west: exports/daily-west/Order_Detail.csv</text>
  </g>
</svg>
