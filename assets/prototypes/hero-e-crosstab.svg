    <text x="64" y="138" font-size="15" fill="#5b6470">Order Detail <tspan fill="#482878" font-weight="700">· hidden sheet</tspan></text>

    <text x="1216" y="92" font-size="22" font-weight="600" fill="#1d2330" text-anchor="end">Crosstab any sheet. Skip the workbook.</text>
    <text x="1216" y="122" font-size="14" fill="#5b6470" text-anchor="end">Download &#8594; Crosstab &#8594; CSV, from the command line.</text>

