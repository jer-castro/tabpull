<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">tabpull: crosstab any sheet, skip the workbook</title>
  <desc id="desc">The card is a Tableau-style highlight table titled Order Detail, a hidden sheet, with regions as rows and months as columns. tabpull exports sheets like this as crosstab CSV without downloading the workbook.</desc>

  <rect width="1280" height="480" rx="14" fill="#fbfbf8"/>
  <rect x="0.5" y="0.5" width="1279" height="479" rx="13.5" fill="none" stroke="#1d2330" stroke-opacity=".14"/>

